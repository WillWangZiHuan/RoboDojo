name: Seven blocks protocol
on:
  push:
    paths:
      - 'experiments/seven_blocks/**'
      - 'tests/test_seven_blocks.py'
      - '.github/workflows/seven-blocks.yml'
  pull_request:
    paths:
      - 'experiments/seven_blocks/**'
      - 'tests/test_seven_blocks.py'
      - '.github/workflows/seven-blocks.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_seven_blocks.py' -v
      - run: python -m compileall -q experiments/seven_blocks
